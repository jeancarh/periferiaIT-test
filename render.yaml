services:
  - type: web
    name: periferia-oc-agent
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_MAX_SESSION_TOKENS
        value: "150000"
      - key: AGENT_MAX_DAILY_REQUESTS
        value: "300"
      - key: AGENT_MAX_DAILY_TOKENS
        value: "3000000"
